<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Реєстр автентичності — перевірка картини</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jetbrains+Mono:wght@400;500&display=swap');

  :root{
    --ink:#1c1a16;
    --parchment:#ece5d3;
    --parchment-dim:#d9cfb4;
    --seal:#7a2e2e;
    --seal-bright:#9c3b3b;
    --ok:#4c7a52;
    --ok-bright:#5f9366;
    --gold:#b8965a;
    --gold-light:#c7ac74;
    --line: rgba(184,150,90,0.35);
    --surface: var(--ink);
    --text: var(--parchment);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}

  html,body{ height:100%; }

  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, rgba(184,150,90,0.06), transparent 60%),
      var(--surface);
    color:var(--text);
    font-family:'Cormorant Garamond', serif;
    display:flex;
    justify-content:center;
    padding:calc(48px + env(safe-area-inset-top, 0px)) 20px calc(48px + env(safe-area-inset-bottom, 0px));
  }

  .sheet{ width:100%; max-width:640px; }

  .eyebrow{
    font-family:'Jetbrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:10px;
  }

  h1{
    font-weight:500;
    font-size:36px;
    line-height:1.15;
    margin:0 0 6px;
  }

  .sub{
    font-size:16px;
    color:var(--parchment-dim);
    font-style:italic;
    margin:0 0 30px;
    max-width:50ch;
  }

  .card{
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    padding:32px;
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid rgba(184,150,90,0.15);
    pointer-events:none;
  }

  label{
    display:block;
    font-family:'Jetbrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:8px;
  }

  .field{ margin-bottom:22px; }

  input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--text);
    font-family:'Cormorant Garamond', serif;
    font-size:22px;
    padding:6px 2px 10px;
    outline:none;
    transition:border-color 0.25s ease;
  }
  input::placeholder{ color:rgba(236,229,211,0.28); font-style:italic; }
  input:focus{ border-bottom-color:var(--gold); }

  button{
    width:100%;
    margin-top:8px;
    padding:16px;
    color:var(--text);
    border:1px solid;
    font-family:'Jetbrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    cursor:pointer;
    transition:filter 0.25s ease, transform 0.15s ease;
    background:var(--ok);
    border-color:var(--ok-bright);
  }
  button:hover{ filter:brightness(1.12); }
  button:active{ transform:scale(0.995); }

  .result{
    margin-top:28px;
    display:none;
    animation: rise 0.4s ease forwards;
    border-top:1px dashed var(--line);
    padding-top:24px;
  }
  .result.show{ display:block; }

  @keyframes rise{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .status-line{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
  }
  .status-dot{
    width:14px; height:14px;
    border-radius:50%;
    flex:0 0 auto;
  }
  .status-dot.good{ background:var(--ok-bright); box-shadow:0 0 12px rgba(95,147,102,0.6); }
  .status-dot.bad{ background:var(--seal-bright); box-shadow:0 0 12px rgba(156,59,59,0.6); }

  .status-text{
    font-family:'Jetbrains Mono', monospace;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .status-text.good{ color:var(--ok-bright); }
  .status-text.bad{ color:var(--seal-bright); }

  .photo-wrap{
    width:100%;
    margin-bottom:20px;
    border:1px solid var(--line);
    overflow:hidden;
    background:rgba(255,255,255,0.02);
  }
  .photo-wrap img{
    display:block;
    width:100%;
    height:auto;
    max-height:420px;
    object-fit:contain;
  }

  .detail-grid{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:9px 18px;
    font-size:18px;
  }
  .detail-grid .k{
    font-family:'Jetbrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:rgba(236,229,211,0.45);
    padding-top:3px;
    white-space:nowrap;
  }
  .detail-grid .v{ color:var(--text); }

  .footnote{
    margin-top:24px;
    font-family:'Jetbrains Mono', monospace;
    font-size:10.5px;
    line-height:1.7;
    color:rgba(236,229,211,0.38);
  }

  @media (max-width:480px){
    h1{ font-size:28px; }
    .detail-grid{ grid-template-columns:1fr; }
    .detail-grid .k{ padding-top:10px; }
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="eyebrow">Атрибуційний реєстр · Провенанс</div>
  <h1>Перевірка картини</h1>
  <p class="sub">Введіть код, вказаний на картині та сертифікаті, щоб підтвердити оригінальність.</p>

  <div class="card">
    <div class="field">
      <label for="checkCode">Код з картини або сертифіката</label>
      <input id="checkCode" type="text" placeholder="ОК-2026-047-X9K2" autocomplete="off">
    </div>
    <button id="checkBtn">Перевірити</button>

    <div class="result" id="checkResult"></div>
  </div>

  <div class="footnote">
    Реєстр веде художник особисто — кожен запис додається вручну після продажу картини. Ця сторінка доступна лише для перегляду.
  </div>
</div>

<script>
// Реєстр картин — додається/оновлюється художником через Claude.
// Щоб додати нову картину, напишіть у чаті: код, назву, опис і, за бажанням, фото.
const PAINTINGS = [
  // Приклад запису (видаліть/замініть реальними даними):
  // {
  //   code: "ОК-2026-047-X9K2",
  //   title: "Осінній сад",
  //   note: "олія, полотно, 60×80 см",
  //   photo: "",
  //   addedAt: "2026-10-19"
  // },
];

function normalizeCode(raw){
  return raw.trim().toUpperCase().replace(/\s+/g,'');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function findPainting(code){
  return PAINTINGS.find(p => normalizeCode(p.code) === code) || null;
}

function formatDate(iso){
  if(!iso) return '—';
  try{
    return new Date(iso).toLocaleDateString('uk-UA');
  }catch(e){
    return iso;
  }
}

const checkBtn = document.getElementById('checkBtn');
const checkResult = document.getElementById('checkResult');
const checkInput = document.getElementById('checkCode');

function runCheck(){
  const code = normalizeCode(checkInput.value);
  if(!code) return;

  const record = findPainting(code);
  checkResult.classList.add('show');

  if(record){
    const photoHtml = record.photo
      ? `<div class="photo-wrap"><img src="${record.photo}" alt="${escapeHtml(record.title)}"></div>`
      : '';
    checkResult.innerHTML = `
      <div class="status-line">
        <div class="status-dot good"></div>
        <div class="status-text good">Код підтверджено — оригінал</div>
      </div>
      ${photoHtml}
      <div class="detail-grid">
        <div class="k">Код</div><div class="v">${escapeHtml(record.code)}</div>
        <div class="k">Назва</div><div class="v">${escapeHtml(record.title || '—')}</div>
        <div class="k">Опис</div><div class="v">${escapeHtml(record.note || '—')}</div>
        <div class="k">Зареєстровано</div><div class="v">${formatDate(record.addedAt)}</div>
      </div>
    `;
  } else {
    checkResult.innerHTML = `
      <div class="status-line">
        <div class="status-dot bad"></div>
        <div class="status-text bad">Код не знайдено в реєстрі</div>
      </div>
      <div class="detail-grid">
        <div class="k">Код</div><div class="v">${escapeHtml(code)}</div>
      </div>
    `;
  }
}

checkBtn.addEventListener('click', runCheck);
checkInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') runCheck(); });

// Авто-перевірка, якщо код переданий у посиланні: ?code=ОК-2026-047-X9K2
const params = new URLSearchParams(window.location.search);
const urlCode = params.get('code');
if(urlCode){
  checkInput.value = urlCode;
  runCheck();
}
</script>

</body>
</html>
