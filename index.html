<!DOCTYPE html>
<html lang="uk" data-title-key="titleIndex">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Перевірка картини — Tatiana Sova</title>
<link rel="stylesheet" href="brand.css">
</head>
<body>

<header class="topband">
  <div class="lang"><button type="button" data-lang="uk">UA</button><button type="button" data-lang="en">EN</button></div>
  <img src="logo.png" alt="Tatiana Sova">
</header>

<main class="sheet">
  <div class="eyebrow" data-i18n="eyebrow"></div>
  <h1 data-i18n="h1"></h1>
  <p class="sub" data-i18n="sub"></p>
  <a class="nav-link" href="catalog.html" data-i18n="toCatalog"></a>

  <div class="card">
    <span class="lbl" data-i18n="codeLabel"></span>
    <div class="code-mask" id="codeMask">
      <input id="c1" class="s1" type="text" placeholder="AB" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Initials">
      <span class="sep">–</span>
      <input id="c2" class="s2" type="text" inputmode="numeric" placeholder="2026" autocomplete="off" aria-label="Year">
      <span class="sep">–</span>
      <input id="c3" class="s3" type="text" inputmode="numeric" placeholder="047" autocomplete="off" aria-label="Number">
      <span class="sep">–</span>
      <input id="c4" class="s4" type="text" placeholder="A1B2" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Check code">
    </div>
    <div class="seg-labels">
      <span class="s1" data-i18n="segInitials"></span><i></i>
      <span class="s2" data-i18n="segYear"></span><i></i>
      <span class="s3" data-i18n="segNo"></span><i></i>
      <span class="s4" data-i18n="segCheck"></span>
    </div>
    <div class="hint" data-i18n="codeHint"></div>

    <button id="checkBtn" type="button" data-i18n="verify" disabled></button>
    <div class="result" id="checkResult" aria-live="polite"></div>
  </div>

  <div class="footnote" id="statusNote"></div>
</main>

<script src="common.js"></script>
<script>
(function(){
  const { t, esc, parseCSV, canon, pick, fmtDate } = Site;
  const boxes = ['c1','c2','c3','c4'].map(id => document.getElementById(id));
  const btn = document.getElementById('checkBtn');
  const resultEl = document.getElementById('checkResult');
  const noteEl = document.getElementById('statusNote');

  let PAINTINGS = [], loaded = false, failed = false, last = null;

  /* ---------- маска коду ---------- */
  const RULES = [
    { filter: v => v.replace(/[^\p{L}]/gu,'').toUpperCase(),   max:3, advanceAt:3 },
    { filter: v => v.replace(/\D/g,''),                         max:4, advanceAt:4 },
    { filter: v => v.replace(/\D/g,''),                         max:6, advanceAt:3 },
    { filter: v => v.replace(/[^A-Za-z0-9]/g,'').toUpperCase(), max:4, advanceAt:null }
  ];
  const seg = () => ({ a:boxes[0].value, b:boxes[1].value, c:boxes[2].value, d:boxes[3].value });
  const isComplete = s => s.a.length>=1 && s.b.length===4 && s.c.length>=1 && s.d.length===4;

  function parseWhole(txt){
    const s = txt.trim().toUpperCase().replace(/[\s–—_./]+/g,'-');
    const m = s.match(/^(\p{L}{1,3})-?(\d{4})-?(\d{1,6})-?([A-Z0-9]{4})$/u);
    return m ? { a:m[1], b:m[2], c:m[3], d:m[4] } : null;
  }
  function fill(s){
    boxes[0].value=s.a; boxes[1].value=s.b; boxes[2].value=s.c; boxes[3].value=s.d;
    boxes[3].focus(); runCheck();
  }

  boxes.forEach((el,i) => {
    el.addEventListener('input', () => {
      const r = RULES[i];
      const raw = el.value;
      const endsWithSep = /[-–—\s./]$/.test(raw);          // користувач набрав «-» або пробіл
      el.value = r.filter(raw).slice(0, r.max);
      if (i<3 && el.value && (endsWithSep || (r.advanceAt && el.value.length>=r.advanceAt))) boxes[i+1].focus();
      const s = seg();
      if (isComplete(s)) runCheck(); else resultEl.classList.remove('show');
    });
    el.addEventListener('paste', e => {
      const txt = (e.clipboardData || window.clipboardData).getData('text');
      const s = parseWhole(txt);
      if (s){ e.preventDefault(); fill(s); }
    });
    el.addEventListener('keydown', e => {
      if (e.key==='Enter'){ e.preventDefault(); runCheck(); }
      else if (e.key==='Backspace' && el.value==='' && i>0){ e.preventDefault(); const p=boxes[i-1]; p.focus(); p.setSelectionRange(p.value.length,p.value.length); }
      else if (e.key==='ArrowLeft'  && el.selectionStart===0 && i>0){ e.preventDefault(); boxes[i-1].focus(); }
      else if (e.key==='ArrowRight' && el.selectionStart===el.value.length && i<3){ e.preventDefault(); boxes[i+1].focus(); }
    });
  });

  /* ---------- перевірка ---------- */
  function runCheck(){
    const s = seg();
    if (!isComplete(s)){ last = { incomplete:true }; render(); return; }
    if (failed){ last = { failed:true }; render(); return; }
    if (!loaded) return;
    const code = `${s.a}-${s.b}-${s.c.padStart(3,'0')}-${s.d}`;
    const rec = PAINTINGS.find(p => canon(p.code) === canon(code)) || null;
    last = { code, rec };
    render();
    resultEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  function render(){
    if (!last){ resultEl.classList.remove('show'); return; }
    resultEl.classList.add('show');
    if (last.incomplete){ resultEl.innerHTML = `<div class="panel bad"><p class="bad-help">${esc(t('incomplete'))}</p></div>`; return; }
    if (last.failed){ resultEl.innerHTML = `<div class="panel bad"><p class="bad-help">${esc(t('loadFail'))}</p></div>`; return; }
    const r = last.rec;
    if (r){
      const src = Site.photoUrl(r.photo);
      const photo = src ? `<div class="art"><div class="art-frame" role="button" tabindex="0" aria-label="${esc(t('zoom'))}"><img class="art-img" src="${esc(src)}" alt="${esc(pick(r,'title'))}"></div><div class="art-hint">${esc(t('zoom'))}</div></div>` : '';
      resultEl.innerHTML = `<div class="panel">
        <div class="status-line"><div class="status-dot good"></div><div class="status-text">${esc(t('good'))}</div></div>
        ${photo}
        <div class="detail-grid">
          <div class="k">${esc(t('kCode'))}</div><div class="v">${esc(r.code)}</div>
          <div class="k">${esc(t('kTitle'))}</div><div class="v">${esc(pick(r,'title') || '—')}</div>
          <div class="k">${esc(t('kNote'))}</div><div class="v">${esc(pick(r,'note') || '—')}</div>
          <div class="k">${esc(t('kDate'))}</div><div class="v">${esc(fmtDate(r.addedAt))}</div>
        </div></div>`;
    } else {
      resultEl.innerHTML = `<div class="panel bad">
        <div class="status-line"><div class="status-dot bad"></div><div class="status-text">${esc(t('bad'))}</div></div>
        <p class="bad-help">${esc(t('badHelp'))}</p></div>`;
    }
    Site.hookImages(resultEl);
  }

  function renderNote(){
    noteEl.textContent = failed ? t('loadFail') : (loaded ? t('loaded',{n:PAINTINGS.length}) : t('loading'));
  }
  Site.onLang(() => { renderNote(); render(); });
  btn.addEventListener('click', runCheck);

  /* ---------- завантаження реєстру ---------- */
  renderNote();
  fetch('paintings.csv?t=' + Date.now())
    .then(r => { if(!r.ok) throw new Error(); return r.text(); })
    .then(txt => { PAINTINGS = parseCSV(txt); loaded = true; })
    .catch(() => { failed = true; })
    .finally(() => {
      btn.disabled = false; renderNote();
      const q = new URLSearchParams(location.search).get('code');
      const s = q && parseWhole(q);
      if (s) fill(s);
    });
})();
</script>
</body>
</html>
